name: Update Football Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get football data
        run: |
          curl -fsS \
          -H "X-Auth-Token: ${{ secrets.FOOTBALL_API_TOKEN }}" \
          "https://api.football-data.org/v4/matches?dateFrom=$(date -u +%Y-%m-%d)&dateTo=$(date -u -d '+30 days' +%Y-%m-%d)" \
          -o data.json

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Update football data" || echo "No changes"
          git push
