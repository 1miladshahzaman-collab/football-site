<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOOTNAMA | فوتبال‌نما</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,Arial,sans-serif}
body{background:#07111f;color:#fff}
header{background:#0b1728;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1c3048}
.logo{font-size:27px;font-weight:bold;color:#19e68c}
nav a{color:#ddd;text-decoration:none;margin:0 9px;font-size:14px}
nav a:hover{color:#19e68c}
.hero{padding:65px 6%;text-align:center;background:linear-gradient(135deg,#0b1d32,#07111f)}
.hero h1{font-size:45px;margin-bottom:15px}
.hero span{color:#19e68c}
.hero p{color:#aebdcc;font-size:17px}
.container{width:88%;max-width:1200px;margin:40px auto}
.title{font-size:24px;margin-bottom:20px;border-right:4px solid #19e68c;padding-right:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:#0d1b2d;border:1px solid #1d334b;border-radius:14px;padding:22px}
.match{text-align:center}
.league{color:#19e68c;font-size:13px;margin-bottom:15px}
.teams{font-size:18px;font-weight:bold;margin-bottom:12px}
.time{color:#9eacbb}
.status{color:#19e68c;margin-top:10px}
.loading{text-align:center;color:#9eacbb;padding:30px}
.error{text-align:center;color:#ff7777;padding:20px}
footer{margin-top:60px;padding:30px;text-align:center;background:#050c16;color:#718095}
@media(max-width:700px){
header{flex-direction:column;gap:15px}
nav{text-align:center}
nav a{display:inline-block;margin:6px}
.hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
<div class="logo">⚽ FOOTNAMA</div>

<nav>
<a href="#">خانه</a>
<a href="#matches">بازی‌ها</a>
<a href="#future">آینده</a>
<a href="#news">اخبار</a>
<a href="#table">جدول‌ها</a>
</nav>
</header>

<section class="hero">
<h1>به <span>FOOTNAMA</span> خوش آمدید</h1>
<p>مرجع فوتبال ایران و جهان</p>
</section>

<div class="container" id="matches">
<h2 class="title">🔥 بازی‌های امروز</h2>
<div id="matchesBox" class="cards">
<div class="loading">در حال دریافت اطلاعات بازی‌ها...</div>
</div>
</div>

<div class="container" id="future">
<h2 class="title">📅 بازی‌های آینده</h2>
<div id="futureBox" class="cards">
<div class="loading">در حال دریافت اطلاعات...</div>
</div>
</div>

<footer>
⚽ FOOTNAMA © 2026
<br>
مرجع فوتبال ایران و جهان
</footer>

<script>
async function loadFootball(){

const matchesBox=document.getElementById("matchesBox");
const futureBox=document.getElementById("futureBox");

try{

const response=await fetch("./data.json?"+Date.now());

if(!response.ok) throw new Error("data.json not found");

const data=await response.json();

const matches=data.matches || [];

matchesBox.innerHTML="";
futureBox.innerHTML="";

if(matches.length===0){
matchesBox.innerHTML='<div class="error">فعلاً بازی‌ای پیدا نشد.</div>';
return;
}

const today=new Date().toISOString().slice(0,10);

let todayCount=0;
let futureCount=0;

matches.forEach(match=>{

const home=match.homeTeam?.name || "تیم میزبان";
const away=match.awayTeam?.name || "تیم مهمان";

const date=new Date(match.utcDate);
const dateText=date.toLocaleDateString("fa-IR");
const timeText=date.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"});

const card=`
<div class="card match">
<div class="league">${match.competition?.name || "فوتبال"}</div>
<div class="teams">${home} ⚔️ ${away}</div>
<div class="time">${dateText} — ${timeText}</div>
<div class="status">${match.status || "برنامه‌ریزی شده"}</div>
</div>
`;

if(match.utcDate.slice(0,10)===today && todayCount<12){
matchesBox.innerHTML+=card;
todayCount++;
}else if(futureCount<12){
futureBox.innerHTML+=card;
futureCount++;
}

});

if(todayCount===0){
matchesBox.innerHTML='<div class="error">امروز بازی ثبت‌شده‌ای پیدا نشد.</div>';
}

if(futureCount===0){
futureBox.innerHTML='<div class="error">بازی آینده‌ای پیدا نشد.</div>';
}

}catch(error){

console.log(error);

matchesBox.innerHTML=
'<div class="error">اطلاعات فوتبال هنوز در حال بروزرسانی است.</div>';

futureBox.innerHTML=
'<div class="error">لطفاً چند دقیقه دیگر دوباره سایت را باز کنید.</div>';

}

}

loadFootball();
</script>

</body>
</html>
